[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sparks"
version = "0.1.0"
description = "Situational Personal AI Runtime & Knowledge System"
requires-python = ">=3.11"
dependencies = [
    "SQLAlchemy>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "alembic>=1.14,<2.0",
    "faster-whisper>=1.2,<2.0",
]

[tool.setuptools.packages.find]
where = ["src"]
